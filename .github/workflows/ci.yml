name: CI

on:
  pull_request:
  push:
    branches: [orb-setup, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint
          - name: Typecheck (TypeScript 7 native)
            run: npx tsc --version && npm run typecheck
          - name: SQLite tests
            run: npm test
          - name: Metro iOS export
            run: npm run export:ios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.run }}
