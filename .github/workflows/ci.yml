name: CI

on:
  pull_request:
  push:
    branches: [orb-setup, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint
          - name: Typecheck (TypeScript 7 native)
            run: npx tsc --version && npm run typecheck
          - name: SQLite tests
            run: npm test
          - name: Nutrition history invariants
            run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .agents/skills/verifying-nutrition-history/scripts/check.ts
          - name: Metro iOS export
            run: npm run export:ios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.run }}

  storybook:
    name: Storybook build and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORYBOOK_URL: http://localhost:6006
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install agent-browser and Chromium
        run: npm install -g agent-browser@0.38.1 && agent-browser install --with-deps
      - run: npm run build-storybook
      - name: Serve static Storybook
        run: python3 -m http.server 6006 -d storybook-static >/tmp/storybook-http.log 2>&1 &
      - name: Run story play functions in Chromium
        run: |
          curl -sf --retry 10 --retry-connrefused "$STORYBOOK_URL/index.json" >/dev/null
          npm run test:storybook
